<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wikipeterson</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:    #1a1410;
    --paper:  #f5f0e8;
    --cream:  #ede7d9;
    --sepia:  #8b6f47;
    --red:    #9b1c1c;
    --red2:   #b91c1c;
    --gold:   #c9a84c;
    --gold2:  #e6c56a;
    --line:   rgba(139,111,71,0.22);
    --shadow: rgba(26,20,16,0.10);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Source Serif 4', Georgia, serif;
    background-color: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    background-image: repeating-linear-gradient(
      transparent, transparent 31px,
      var(--line) 31px, var(--line) 32px
    );
    background-attachment: fixed;
  }

  /* ── MASTHEAD ── */
  .masthead {
    background: var(--red);
    color: var(--paper);
    text-align: center;
    padding: 22px 20px 18px;
    position: relative;
    overflow: hidden;
  }
  .masthead::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      90deg, transparent, transparent 60px,
      rgba(0,0,0,0.04) 60px, rgba(0,0,0,0.04) 61px
    );
  }
  .masthead::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--gold), var(--gold2), var(--gold));
  }
  .masthead-rule {
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 10px; width: 160px;
  }
  .masthead-wordmark {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 6vw, 3.8rem);
    font-weight: 900;
    letter-spacing: 0.02em;
    line-height: 1.1;
    position: relative;
  }
  .masthead-topic {
    font-size: clamp(0.85rem, 2.5vw, 1.15rem);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(245,240,232,0.82);
    margin-top: 6px;
    font-weight: 300;
    position: relative;
  }
  .masthead-brand {
    font-family: 'Playfair Display', serif;
    font-size: clamp(0.85rem, 2vw, 1.05rem);
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--gold2);
    margin-top: 8px;
    position: relative;
  }
  .masthead-tagline {
    font-family: 'Source Serif 4', serif;
    font-style: italic;
    font-size: clamp(0.65rem, 1.5vw, 0.78rem);
    color: rgba(245,240,232,0.6);
    margin-top: 5px;
    position: relative;
  }
  .masthead-rule-bottom {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 10px auto 0; width: 160px;
  }

  /* ── MAIN ── */
  .main-container {
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  .section-label {
    font-size: 0.7rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--sepia);
    border-bottom: 1px solid var(--line);
    padding-bottom: 10px;
    margin-bottom: 20px;
  }

  /* ── CARDS ── */
  .cards { display: flex; flex-direction: column; gap: 14px; }

  .card {
    display: flex;
    align-items: center;
    gap: 20px;
    background: white;
    border: 1px solid var(--line);
    border-left: 4px solid var(--red);
    border-radius: 2px;
    padding: 22px 26px;
    text-decoration: none;
    color: var(--ink);
    box-shadow: 0 2px 12px var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-left-color 0.15s;
    animation: cardIn 0.38s cubic-bezier(0.22,1,0.36,1) both;
  }
  .card:nth-child(1) { animation-delay: 0.05s; }
  .card:nth-child(2) { animation-delay: 0.13s; }
  .card:nth-child(3) { animation-delay: 0.21s; }

  @keyframes cardIn {
    from { opacity:0; transform:translateY(14px) scale(0.985); }
    to   { opacity:1; transform:translateY(0) scale(1); }
  }

  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px var(--shadow);
    border-left-color: var(--gold);
  }

  .card-icon {
    font-size: 1.8rem;
    width: 52px;
    height: 52px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--cream);
    border: 1px solid var(--line);
    border-radius: 2px;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    color: var(--red);
  }

  .card-body { flex: 1; }

  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 4px;
    line-height: 1.2;
  }

  .card-desc {
    font-size: 0.88rem;
    color: var(--sepia);
    line-height: 1.55;
    font-style: italic;
  }

  .card-tag {
    font-size: 0.65rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--red);
    background: rgba(155,28,28,0.07);
    border: 1px solid rgba(155,28,28,0.18);
    border-radius: 20px;
    padding: 3px 11px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .card-arrow {
    color: var(--sepia);
    font-size: 1.1rem;
    flex-shrink: 0;
    transition: transform 0.15s, color 0.15s;
  }
  .card:hover .card-arrow {
    color: var(--gold);
    transform: translateX(4px);
  }

  /* ── FOOTER ── */
  .site-footer {
    margin-top: 48px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    text-align: center;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    color: var(--sepia);
    font-style: italic;
  }
  .footer-rule {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    width: 80px;
    margin: 0 auto 12px;
  }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--cream); }
  ::-webkit-scrollbar-thumb { background: var(--red); border-radius: 3px; }

  @media (max-width: 540px) {
    .card { padding: 16px 16px; gap: 14px; }
    .card-icon { width: 42px; height: 42px; font-size: 1.4rem; }
  }
</style>
</head>
<body>

<div class="masthead">
  <div class="masthead-rule"></div>
  <div class="masthead-wordmark">Wikipeterson</div>
  <div class="masthead-topic">Math &amp; More</div>
  <div class="masthead-brand">Resources &amp; Tools</div>
  <div class="masthead-tagline" id="tagline"></div>
  <div class="masthead-rule-bottom"></div>
</div>

<div class="main-container">
  <div class="section-label">Available Resources</div>

  <div class="cards">

    <a class="card" href="PowerSeriesPractice.html">
      <div class="card-icon">∑</div>
      <div class="card-body">
        <div class="card-title">Power Series Practice</div>
        <div class="card-desc">AP-style questions on Taylor &amp; power series with step-by-step solutions and streak tracking.</div>
      </div>
      <span class="card-tag">Calculus</span>
      <span class="card-arrow">→</span>
    </a>

    <a class="card" href="NCAA2026.html">
      <div class="card-icon">🏀</div>
      <div class="card-body">
        <div class="card-title">NCAA 2026</div>
        <div class="card-desc">Tournament bracket tracker for the 2026 NCAA season.</div>
      </div>
      <span class="card-tag">Sports</span>
      <span class="card-arrow">→</span>
    </a>

  </div>

  <div class="site-footer">
    <div class="footer-rule"></div>
    wikipeterson.github.io
  </div>
</div>

<script>
const TAGLINES = [
  "Where your math is right or it's free. Guaranteed!™",
  "Mathematically proven to be mathematics.",
  "Side effects may include understanding calculus.",
  "The limit, as studying → ∞, of your grade is 5.",
  "Epsilon-delta tested. Teacher approved.",
  "More tools coming soon.",
];
document.getElementById('tagline').textContent =
  '"' + TAGLINES[Math.floor(Math.random() * TAGLINES.length)] + '"';
</script>
</body>
</html>
