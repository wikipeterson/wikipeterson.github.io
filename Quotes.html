<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quotes — Wikipeterson</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1a1410;--paper:#f5f0e8;--cream:#ede7d9;--sepia:#8b6f47;--red:#9b1c1c;--red2:#b91c1c;--gold:#c9a84c;--gold2:#e6c56a;--line:rgba(139,111,71,0.22);--shadow:rgba(26,20,16,0.10);}
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Source Serif 4',Georgia,serif;background-color:var(--paper);color:var(--ink);min-height:100vh;background-image:repeating-linear-gradient(transparent,transparent 31px,var(--line) 31px,var(--line) 32px);background-attachment:fixed;}
  .masthead{background:var(--red);color:var(--paper);text-align:center;padding:22px 20px 18px;position:relative;overflow:hidden;}
  .masthead::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent,transparent 60px,rgba(0,0,0,0.04) 60px,rgba(0,0,0,0.04) 61px);}
  .masthead::after{content:'';position:absolute;bottom:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold));}
  .home-btn{position:absolute;top:10px;left:12px;z-index:10;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);border-radius:6px;padding:5px 10px;color:rgba(255,255,255,0.85);font-family:'Source Serif 4',Georgia,serif;font-size:0.75rem;text-decoration:none;letter-spacing:.05em;transition:background .18s;}
  .home-btn:hover{background:rgba(255,255,255,0.22);color:#fff;}
  .masthead-rule{height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto 10px;width:160px;}
  .masthead-wordmark{font-family:'Playfair Display',serif;font-size:clamp(2.2rem,6vw,3.8rem);font-weight:900;letter-spacing:0.02em;line-height:1.1;position:relative;}
  .masthead-topic{font-size:clamp(0.85rem,2.5vw,1.15rem);letter-spacing:0.2em;text-transform:uppercase;color:rgba(245,240,232,0.82);margin-top:6px;font-weight:300;position:relative;}
  .masthead-brand{font-family:'Playfair Display',serif;font-size:clamp(0.85rem,2vw,1.05rem);font-weight:700;letter-spacing:0.08em;color:var(--gold2);margin-top:8px;position:relative;}
  .masthead-rule-bottom{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:10px auto 0;width:160px;}
  .main-container{max-width:760px;margin:0 auto;padding:40px 20px 80px;}
  .section-label{font-size:0.7rem;letter-spacing:0.16em;text-transform:uppercase;font-weight:700;color:var(--sepia);border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:24px;}
  .status{font-style:italic;color:var(--sepia);font-size:1rem;padding:40px 0;text-align:center;}
  .quote-list{display:flex;flex-direction:column;box-shadow:0 2px 12px var(--shadow);}
  .quote-item{display:flex;gap:20px;padding:20px 24px;border-bottom:1px solid var(--line);background:white;animation:fadeIn 0.3s ease both;transition:background 0.15s;}
  .quote-item:first-child{border-top:4px solid var(--red);border-radius:2px 2px 0 0;}
  .quote-item:last-child{border-bottom:none;border-radius:0 0 2px 2px;}
  .quote-item:hover{background:#fdf9f3;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .quote-num{font-family:'Playfair Display',serif;font-size:0.85rem;font-weight:700;color:var(--red);opacity:0.35;min-width:28px;padding-top:3px;flex-shrink:0;text-align:right;}
  .quote-body{flex:1;}
  .quote-text{font-family:'Playfair Display',serif;font-style:italic;font-size:1rem;line-height:1.65;color:var(--ink);}
  .quote-author{margin-top:6px;font-size:0.78rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--sepia);font-weight:600;}
  .site-footer{margin-top:48px;padding-top:14px;border-top:1px solid var(--line);text-align:center;font-size:0.72rem;letter-spacing:0.1em;color:var(--sepia);font-style:italic;}
  .footer-rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);width:80px;margin:0 auto 12px;}
  ::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:var(--cream);}::-webkit-scrollbar-thumb{background:var(--red);border-radius:3px;}
  @media(max-width:540px){.quote-item{padding:16px;gap:12px;}}
</style>
</head>
<body>
<div class="masthead">
  <a class="home-btn" href="https://wikipeterson.org">&#8592; Home</a>
  <div class="masthead-rule"></div>
  <div class="masthead-wordmark">Quotes</div>
  <div class="masthead-topic">It's just like Dr. Peterson used to always say...</div>
  <div class="masthead-brand">Wikipeterson Math</div>
  <div class="masthead-rule-bottom"></div>
</div>
<div class="main-container">
  <div class="section-label" id="sectionLabel">Loading quotes...</div>
  <div id="statusMsg" class="status">Loading...</div>
  <div class="quote-list" id="quoteList"></div>
  <div class="site-footer"><div class="footer-rule"></div>wikipeterson.github.io</div>
</div>
<script>
const APPS_URL = 'https://script.google.com/macros/s/AKfycbx2i6MzYstdNztyAzFYp0bd8PvKMtqfy5n94QEp6UGVQLCCyhxdtkIU3INezzJTpPE/exec';
async function loadQuotes() {
  try {
    const res = await fetch(APPS_URL);
    const quotes = await res.json();
    document.getElementById('statusMsg').style.display = 'none';
    document.getElementById('sectionLabel').textContent = `${quotes.length} Quotes`;
    const list = document.getElementById('quoteList');
    quotes.forEach((q, i) => {
      const item = document.createElement('div');
      item.className = 'quote-item';
      item.style.animationDelay = Math.min(i * 0.015, 0.6) + 's';
      item.innerHTML = `<div class="quote-num">${i+1}</div><div class="quote-body"><div class="quote-text">${q.quote}</div>${q.author ? `<div class="quote-author">— ${q.author}</div>` : ''}</div>`;
      list.appendChild(item);
    });
  } catch(e) {
    document.getElementById('statusMsg').textContent = 'Could not load quotes.';
  }
}
loadQuotes();
</script>
</body>
</html>
