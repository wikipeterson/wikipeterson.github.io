<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200" role="img" aria-labelledby="title desc">
  <title id="title">Sigma Math full logo for dark backgrounds</title>
  <desc id="desc">A high-contrast Sigma Math logo with a sigma badge and classic wordmark.</desc>
  <defs>
    <style>
      .serif { font-family: "Century Schoolbook", "Century Schoolbook L", "New Century Schoolbook", "TeX Gyre Schola", Georgia, serif; }
    </style>
  </defs>
  <circle cx="96" cy="100" r="66" fill="#8B1A1A"/>
  <circle cx="96" cy="100" r="66" fill="none" stroke="#C8A84B" stroke-width="3"/>
  <text x="96" y="118" text-anchor="middle" class="serif" font-size="74" font-weight="700" fill="#F5EFDF">&#x03A3;</text>
  <text x="186" y="92" class="serif" font-size="54" font-weight="700" fill="#F5EFDF" letter-spacing="-1">Sigma Math</text>
  <text x="188" y="120" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#D9CFC2" letter-spacing="3">PRACTICE · PROBLEMS · PROGRESS</text>
  <line x1="188" y1="132" x2="566" y2="132" stroke="#C8A84B" stroke-width="1.2"/>
  <text x="188" y="154" class="serif" font-size="14" font-style="italic" fill="#F0B429">by Wikipeterson</text>
</svg>
