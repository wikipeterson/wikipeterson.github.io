<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" aria-labelledby="title desc">
  <title id="title">Wikipeterson wordmark logo</title>
  <desc id="desc">A scholarly wordmark with a gold integral sign and maroon serif lettering.</desc>
  <rect width="900" height="240" fill="#f5f0e8"/>
  <g transform="translate(64 48)">
    <line x1="0" y1="156" x2="770" y2="156" stroke="#d2c3a8" stroke-width="2"/>
    <text x="0" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="142" font-style="italic" fill="#f0b429">∫</text>
    <text x="92" y="118" font-family="'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="88" letter-spacing="1.5" fill="#7A1518">Wikipeterson</text>
    <text x="98" y="154" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="9" fill="#8b6f47">MATH AND MORE</text>
  </g>
</svg>
