<style>

.btn-restart:hover{background:var(--red2);}

<script>
const APPS_URL='https://script.google.com/macros/s/AKfycbx2i6MzYstdNztyAzFYp0bd8PvKMtqfy5n94QEp6UGVQLCCyhxdtkIU3INezzJTpPE/exec';
fetch(APPS_URL).then(r=>r.json()).then(data=>{
  if(data.taglines&&data.taglines.length){
    const t=data.taglines[Math.floor(Math.random()*data.taglines.length)];
    document.getElementById('tagline').textContent=t;
  }
}).catch(()=>{});

const QUESTIONS=[
{q:`Which of the following statements about convergence of the series \\(\\displaystyle\\sum_{n=1}^{\\infty}\\frac{1}{\\ln(n+1)}\\) is true?`,
choices:[`\\(\\displaystyle\\sum_{n=1}^{\\infty}\\frac{1}{\\ln(n+1)}\\) converges by comparison with \\(\\displaystyle\\sum_{n=1}^{\\infty}\\frac{1}{n}\\)`,`\\(\\displaystyle\\sum_{n=1}^{\\infty}\\frac{1}{\\ln(n+1)}\\) converges by comparison with \\(\\displaystyle\\sum_{n=1}^{\\infty}\\frac{1}{n^2}\\)`,`\\(\\displaystyle\\sum_{n=1}^{\\infty}\\frac{1}{\\ln(n+1)}\\) diverges by comparison with \\(\\displaystyle\\sum_{n=1}^{\\infty}\\frac{1}{n}\\)`,`\\(\\displaystyle\\sum_{n=1}^{\\infty}\\frac{1}{\\ln(n+1)}\\) diverges by comparison with \\(\\displaystyle\\sum_{n=1}^{\\infty}\\frac{1}{n^2}\\)`],
answer:2,
solution:[{step:"1",text:`Since \\(\\ln(n+1) \\leq n\\) for \\(n \\geq 1\\), we have \\(\\frac{1}{\\ln(n+1)} \\geq \\frac{1}{n}\\).`},{step:"2",text:`The harmonic series \\(\\sum \\frac{1}{n}\\) diverges (p-series, \\(p=1\\)).`},{step:"3",text:`By the Direct Comparison Test, since our terms are larger than those of a divergent series, \\(\\sum\\frac{1}{\\ln(n+1)}\\) also <strong>diverges</strong>.`}]},

{q:`Which of the following series are <strong>conditionally convergent</strong>?<br><br>\\(i.\\;\\displaystyle\\sum_{n=1}^{\\infty}\\frac{(-1)^n}{n}\\)<br><br>\\(ii.\\;\\displaystyle\\sum_{n=1}^{\\infty}\\frac{(-1)^n}{n^3}\\)<br><br>\\(iii.\\;\\displaystyle\\sum_{n=1}^{\\infty}\\frac{(-1)^n}{\\sqrt{n}}\\)`,
choices:["I only","I and II only","I and III only","II and III only"],
answer:2,
solution:[{step:"1",text:`All three converge by the Alternating Series Test (terms positive, decreasing, \\(\\to 0\\)).`},{step:"2",text:`Series I: \\(\\sum\\frac{1}{n}\\) diverges (harmonic). So Series I is <strong>conditionally</strong> convergent. ✓`},{step:"3",text:`Series II: \\(\\sum\\frac{1}{n^3}\\) converges (p-series, \\(p=3>1\\)). So Series II is <strong>absolutely</strong> convergent. ✗`},{step:"4",text:`Series III: \\(\\sum\\frac{1}{n^{1/2}}\\) diverges (p-series, \\(p=\\frac{1}{2}<1\\)). So Series III is <strong>conditionally</strong> convergent. ✓`},{step:"5",text:`Answer: I and III only.`}]},

{q:`Which of the following statements about the series \\(\\displaystyle\\sum_{n=1}^{\\infty}\\frac{1}{2^n - n}\\) is true?`,
choices:[`The series diverges by the \\(n\\)th term test.`,`The series diverges by limit comparison to the harmonic series \\(\\displaystyle\\sum_{n=1}^{\\infty}\\frac{1}{n}\\).`,`The series converges by the \\(n\\)th term test.`,`The series converges by limit comparison to the geometric series \\(\\displaystyle\\sum_{n=1}^{\\infty}\\frac{1}{2^n}\\).`],
answer:3,
solution:[{step:"1",text:`Apply the Limit Comparison Test with \\(b_n = \\frac{1}{2^n}\\), a convergent geometric series (ratio \\(\\frac{1}{2}<1\\)).`},{step:"2",text:`\\(\\lim_{n\\to\\infty}\\frac{1/(2^n-n)}{1/2^n} = \\lim_{n\\to\\infty}\\frac{2^n}{2^n-n} = \\lim_{n\\to\\infty}\\frac{1}{1-n/2^n} = 1\\).`},{step:"3",text:`Since the limit is \\(1\\) (finite, positive), both series behave alike. Since \\(\\sum\\frac{1}{2^n}\\) converges, so does \\(\\sum\\frac{1}{2^n-n}\\).`}]},

{q:`Which of the following series converge?<br><br>\\(\\text{I.}\\;\\displaystyle\\sum_{n=1}^{\\infty}\\frac{1}{\\sqrt{n}}\\)<br><br>\\(\\text{II.}\\;\\displaystyle\\sum_{n=1}^{\\infty}\\frac{3^n}{n!}\\)<br><br>\\(\\text{III.}\\;\\displaystyle\\sum_{n=1}^{\\infty}\\left(\\frac{e}{\\pi}\\right)^n\\)`,
choices:["None","II only","III only","I and II only","II and III only"],
answer:4,
solution:[{step:"1",text:`I: \\(\\sum 1/n^{1/2}\\) is a p-series with \\(p=\\frac{1}{2}<1\\). <strong>Diverges</strong>.`},{step:"2",text:`II: Ratio Test gives \\(\\frac{3}{n+1}\\to 0<1\\). <strong>Converges</strong>.`},{step:"3",text:`III: Geometric series, ratio \\(r=e/\\pi\\approx 0.865<1\\). <strong>Converges</strong>.`},{step:"4",text:`Answer: II and III only.`}]},

{q:`Which of the following series converge?<br><br>\\(\\text{I.}\\; 1+(-1)+1+\\cdots+(-1)^{n-1}+\\cdots\\)<br><br>\\(\\text{II.}\\; 1+\\dfrac{1}{3}+\\dfrac{1}{5}+\\cdots+\\dfrac{1}{2n-1}+\\cdots\\)<br><br>\\(\\text{III.}\\; 1+\\dfrac{1}{3}+\\dfrac{1}{3^2}+\\cdots+\\dfrac{1}{3^{n-1}}+\\cdots\\)`,
choices:["I only","II only","III only","II and III only","I, II, and III"],
answer:2,
solution:[{step:"1",text:`I: Terms alternate ±1, never approach 0. <strong>Diverges</strong> by nth-term test.`},{step:"2",text:`II: \\(\\sum\\frac{1}{2n-1}\\approx\\frac{1}{2}\\sum\\frac{1}{n}\\). <strong>Diverges</strong> by limit comparison with harmonic series.`},{step:"3",text:`III: Geometric, ratio \\(r=\\frac{1}{3}<1\\). <strong>Converges</strong> to \\(\\frac{3}{2}\\).`},{step:"4",text:`Answer: III only.`}]},

{q:`Which of the following series converge?<br><br>\\(\\text{I.}\\;\\displaystyle\\sum_{n=1}^{\\infty}\\frac{8^n}{n!}\\)<br><br>\\(\\text{II.}\\;\\displaystyle\\sum_{n=1}^{\\infty}\\frac{n!}{n^{100}}\\)<br><br>\\(\\text{III.}\\;\\displaystyle\\sum_{n=1}^{\\infty}\\frac{n+1}{n(n+2)(n+3)}\\)`,
choices:["I only","II only","III only","I and III only","I, II, and III"],
answer:3,
solution:[{step:"1",text:`I: Ratio Test: \\(\\frac{8}{n+1}\\to 0<1\\). <strong>Converges</strong>. ✓`},{step:"2",text:`II: Ratio Test: ratio \\(\\to\\infty\\). <strong>Diverges</strong>. ✗`},{step:"3",text:`III: For large \\(n\\), \\(\\frac{n+1}{n(n+2)(n+3)}\\approx\\frac{1}{n^2}\\). Limit comparison with \\(\\sum\\frac{1}{n^2}\\) gives finite positive limit. <strong>Converges</strong>. ✓`},{step:"4",text:`Answer: I and III only.`}]},

{q:`Which of the following series converge?<br><br>\\(\\text{I.}\\;\\displaystyle\\sum_{n=1}^{\\infty}\\frac{|\\sin n|}{n^2}\\)<br><br>\\(\\text{II.}\\;\\displaystyle\\sum_{n=1}^{\\infty}e^{-n}\\)<br><br>\\(\\text{III.}\\;\\displaystyle\\sum_{n=1}^{\\infty}\\frac{n+2}{n^2+n}\\)`,
choices:["I only","II only","III only","I and II only","I and III only"],
answer:3,
solution:[{step:"1",text:`I: \\(\\frac{|\\sin n|}{n^2}\\leq\\frac{1}{n^2}\\). By comparison with convergent p-series \\(\\sum\\frac{1}{n^2}\\). <strong>Converges</strong>. ✓`},{step:"2",text:`II: Geometric, ratio \\(r=e^{-1}<1\\). <strong>Converges</strong>. ✓`},{step:"3",text:`III: \\(\\frac{n+2}{n^2+n}\\approx\\frac{1}{n}\\). Limit comparison with \\(\\sum\\frac{1}{n}\\) gives limit \\(1\\). <strong>Diverges</strong>. ✗`},{step:"4",text:`Answer: I and II only.`}]},

{q:`Which of the following series <strong>diverge</strong>?<br><br>\\(\\text{I.}\\;\\displaystyle\\sum_{n=0}^{\\infty}\\left(\\frac{\\sin 2}{\\pi}\\right)^n\\)<br><br>\\(\\text{II.}\\;\\displaystyle\\sum_{n=1}^{\\infty}\\frac{1}{\\sqrt[3]{n}}\\)<br><br>\\(\\text{III.}\\;\\displaystyle\\sum_{n=1}^{\\infty}\\frac{e^n}{e^n+1}\\)`,
choices:["III only","I and II only","I and III only","II and III only","I, II, and III"],
answer:3,
solution:[{step:"1",text:`I: Geometric, \\(r=\\frac{\\sin 2}{\\pi}\\approx 0.29<1\\). <strong>Converges</strong>. (NOT in the diverge list)`},{step:"2",text:`II: p-series with \\(p=\\frac{1}{3}<1\\). <strong>Diverges</strong>. ✓`},{step:"3",text:`III: \\(\\lim_{n\\to\\infty}\\frac{e^n}{e^n+1}=1\\neq 0\\). <strong>Diverges</strong> by nth-term test. ✓`},{step:"4",text:`Answer: II and III diverge.`}]},

{q:`Which of the following series converge?<br><br>\\(\\text{I.}\\;\\displaystyle\\sum_{n=1}^{\\infty}\\frac{1}{n\\sqrt{n}}\\)<br><br>\\(\\text{II.}\\;\\displaystyle\\sum_{n=1}^{\\infty}\\frac{1}{3^n}\\)<br><br>\\(\\text{III.}\\;\\displaystyle\\sum_{n=1}^{\\infty}\\frac{1}{n\\ln n}\\)`,
choices:["I only","II only","III only","I and II only","I, II, and III"],
answer:3,

{q:`What are all values of \\(p\\) for which the infinite series \\(\\displaystyle\\sum_{n=1}^{\\infty}\\frac{n}{n^p+1}\\) converges?`,

{q:`The infinite series \\(\\displaystyle\\sum_{k=1}^{\\infty}a_k\\) has \\(n\\)th partial sum \\(S_n=(-1)^{n+1}\\) for \\(n\\geq 1\\). What is the sum of the series?`,

{q:`For what values of \\(p\\) will both series \\(\\displaystyle\\sum_{n=1}^{\\infty}\\frac{1}{n^{2p}}\\) and \\(\\displaystyle\\sum_{n=1}^{\\infty}\\left(\\frac{p}{2}\\right)^n\\) converge?`,

{q:`What are all values of \\(p\\) for which \\(\\displaystyle\\int_1^{\\infty}\\frac{1}{x^{2p}}\\,dx\\) converges?`,

{q:`Consider the series \\(\\displaystyle\\sum_{n=1}^{\\infty}\\frac{(-1)^n}{\\cos\\!\\left(\\frac{1}{n}\\right)}\\). Which of the following statements is true?`,

{q:`Consider the series \\(\\displaystyle\\sum_{n=1}^{\\infty}\\frac{(-1)^n}{\\sqrt[3]{n}}\\) and \\(\\displaystyle\\sum_{n=1}^{\\infty}\\frac{(-1)^n}{n^3}\\). Which of the following statements is true?`,

{q:`Which of the following series converges?`,

{q:`Consider the series \\(\\displaystyle\\sum_{n=0}^{\\infty}(-1)^n a_n\\), where \\(a_n>0\\) for all \\(n\\) and \\(\\displaystyle\\lim_{n\\to\\infty}a_n=0\\). Which of the following statements is true?`,

{q:`Which of the following series are <strong>conditionally convergent</strong>?<br><br>\\(\\text{I.}\\;\\displaystyle\\sum_{n=1}^{\\infty}\\frac{(-1)^n}{n!}\\)<br><br>\\(\\text{II.}\\;\\displaystyle\\sum_{n=1}^{\\infty}\\frac{(-1)^n}{\\sqrt{n}}\\)<br><br>\\(\\text{III.}\\;\\displaystyle\\sum_{n=1}^{\\infty}\\frac{(-1)^n}{n+2}\\)`,

{q:`Which of the following statements about the series \\(\\displaystyle\\sum_{n=1}^{\\infty}\\frac{(-1)^n n}{n^2+1}\\) is true?`,

{q:`Which of the following series converge?<br><br>\\(\\text{I.}\\;\\displaystyle\\sum_{n=1}^{\\infty}\\frac{10^n}{n!}\\)<br><br>\\(\\text{II.}\\;\\displaystyle\\sum_{n=1}^{\\infty}e^{-n}\\)<br><br>\\(\\text{III.}\\;\\displaystyle\\sum_{n=1}^{\\infty}\\frac{2^n}{n(n+1)}\\)`,

{q:`Which of the following series converge?<br><br>\\(\\text{I.}\\;\\displaystyle\\sum_{k=1}^{\\infty}\\frac{1}{k^2+1}\\)<br><br>\\(\\text{II.}\\;\\displaystyle\\sum_{k=1}^{\\infty}\\frac{k}{k^2+1}\\)<br><br>\\(\\text{III.}\\;\\displaystyle\\sum_{k=1}^{\\infty}\\frac{k^2}{k^2+1}\\)`,

{q:`If \\(\\displaystyle\\sum_{n=1}^{\\infty}a_n=5\\) and \\(a_n>0\\) for all \\(n\\), which of the following must be true?`,

{q:`What is the sum of the series \\(\\displaystyle\\sum_{n=1}^{\\infty}\\frac{(-2)^n}{e^{n+1}}\\)?`,

{q:`Consider the series \\(\\displaystyle\\sum_{n=1}^{\\infty}\\frac{e^n}{n!}\\). If the ratio test is applied, which of the following inequalities results, implying convergence?`,

choices:[`\\(\\displaystyle\\sum_{n=1}^{\\infty}\\frac{1}{n}\\)`,`\\(\\displaystyle\\sum_{n=1}^{\\infty}\\frac{1}{n^3}\\)`,`\\(\\displaystyle\\sum_{n=1}^{\\infty}\\frac{n}{n+1}\\)`,`\\(\\displaystyle\\sum_{n=1}^{\\infty}\\frac{1}{n^2+1}\\)`],
answer:0,
solution:[{step:"1",text:`For large \\(n\\): \\(\\frac{n^2}{n^3+1}\\approx\\frac{1}{n}\\).`},{step:"2",text:`Limit comparison with \\(\\sum\\frac{1}{n}\\): \\(\\lim_{n\\to\\infty}\\frac{n^2/(n^3+1)}{1/n}=\\lim_{n\\to\\infty}\\frac{n^3}{n^3+1}=1\\). Finite and positive. ✓`},{step:"3",text:`Since \\(\\sum\\frac{1}{n}\\) (harmonic) diverges, the original series also <strong>diverges</strong>.`}]},

{q:`Consider the geometric series \\(\\displaystyle\\sum_{n=1}^{\\infty}a_n\\) where \\(a_n>0\\) for all \\(n\\). The first term is \\(a_1=48\\) and the third term is \\(a_3=12\\). Which of the following statements about \\(\\displaystyle\\sum_{n=1}^{\\infty}a_n\\) is true?`,
choices:[`\\(\\displaystyle\\sum_{n=1}^{\\infty}a_n=64\\)`,`\\(\\displaystyle\\sum_{n=1}^{\\infty}a_n=96\\)`,`\\(\\displaystyle\\sum_{n=1}^{\\infty}a_n\\) converges, but the sum cannot be determined from the information given.`,`\\(\\displaystyle\\sum_{n=1}^{\\infty}a_n\\) diverges`],
answer:1,
solution:[{step:"1",text:`\\(a_3=a_1 r^2\\Rightarrow 12=48r^2\\Rightarrow r^2=\\frac{1}{4}\\Rightarrow r=\\frac{1}{2}\\) (since \\(a_n>0\\)).`},{step:"2",text:`\\(|r|=\\frac{1}{2}<1\\). Converges.`},{step:"3",text:`Sum \\(=\\frac{48}{1-1/2}=\\frac{48}{1/2}=96\\).`}]},

{q:`If \\(\\cos b=\\dfrac{1}{3}\\) for a constant \\(b\\), then \\(\\displaystyle\\sum_{n=0}^{\\infty}\\left(\\sin^2 b\\right)^n=\\)`,
choices:[`\\(\\dfrac{1}{9}\\)`,`\\(\\dfrac{8}{9}\\)`,`\\(\\dfrac{9}{8}\\)`,`\\(9\\)`],
answer:3,
solution:[{step:"1",text:`\\(\\sin^2 b=1-\\cos^2 b=1-\\frac{1}{9}=\\frac{8}{9}\\).`},{step:"2",text:`Geometric series with first term \\(1\\) (at \\(n=0\\)) and ratio \\(r=\\frac{8}{9}<1\\).`},{step:"3",text:`Sum \\(=\\frac{1}{1-8/9}=\\frac{1}{1/9}=9\\).`}]},

{q:`If the series \\(\\displaystyle\\sum_{n=0}^{\\infty}(-1)^n\\frac{B^{n+1}}{A^n}\\) converges, where \\(A\\neq 0\\) and \\(B\\neq 0\\), what is the sum of the series?`,
choices:[`\\(\\dfrac{AB}{A-B}\\)`,`\\(\\dfrac{AB}{A+B}\\)`,`\\(\\dfrac{A}{A-B}\\)`,`\\(\\dfrac{A}{A+B}\\)`],
answer:1,
solution:[{step:"1",text:`Rewrite: \\((-1)^n\\frac{B^{n+1}}{A^n}=B\\cdot(-1)^n\\left(\\frac{B}{A}\\right)^n=B\\left(-\\frac{B}{A}\\right)^n\\).`},{step:"2",text:`Geometric with first term \\(B\\) and ratio \\(r=-\\frac{B}{A}\\).`},{step:"3",text:`Sum \\(=\\frac{B}{1-(-B/A)}=\\frac{B}{1+B/A}=\\frac{B}{(A+B)/A}=\\frac{AB}{A+B}\\).`}]}
];

let queue=[],answered=0,correct=0,wrong=0,streak=0,last10=[],selectedIdx=null,currentQ=null,submitted=false,seenCount=0;

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function pickTagline(){}

function nextQuestion(){
  if(queue.length===0)queue=shuffle([...QUESTIONS]);
  currentQ=queue.pop();selectedIdx=null;submitted=false;seenCount++;
  document.getElementById('qTag').textContent=`Question ${seenCount}`;
  document.getElementById('qSeen').textContent=`${seenCount} of ${QUESTIONS.length} seen`;
  document.getElementById('qText').innerHTML=currentQ.q;
  document.getElementById('resultPanel').style.display='none';
  document.getElementById('streakBanner').style.display='none';
  const sb=document.getElementById('submitBtn');
  sb.disabled=true;sb.textContent='Submit Answer';sb.className='btn btn-primary';sb.onclick=submitAnswer;
  const el=document.getElementById('choices');el.innerHTML='';
  const L=['A','B','C','D','E'];
  currentQ.choices.forEach((ch,i)=>{
    const btn=document.createElement('button');
    btn.className='choice-btn';
    btn.innerHTML=`<span class="choice-letter">(${L[i]})</span><span>${ch}</span>`;
    btn.onclick=()=>selectChoice(i);
    el.appendChild(btn);
  });
  const card=document.getElementById('card');
  card.style.animation='none';card.offsetHeight;card.style.animation='slideIn .35s ease';
  if(window.MathJax)MathJax.typesetPromise([card]);
}

function selectChoice(idx){
  if(submitted)return;
  selectedIdx=idx;
  document.querySelectorAll('.choice-btn').forEach((b,i)=>b.classList.toggle('selected',i===idx));
  document.getElementById('submitBtn').disabled=false;
}

function submitAnswer(){
  if(selectedIdx===null||submitted)return;
  submitted=true;answered++;
  const ok=selectedIdx===currentQ.answer;
  if(ok){correct++;streak++;}else{wrong++;streak=0;}
  last10.push(ok?1:0);if(last10.length>10)last10.shift();
  document.querySelectorAll('.choice-btn').forEach((b,i)=>{
    b.disabled=true;
    if(i===currentQ.answer)b.classList.add('correct-choice');
    else if(i===selectedIdx&&!ok)b.classList.add('wrong-choice');
  });
  const L=['A','B','C','D','E'];
  const v=document.getElementById('verdict');
  v.className='result-verdict '+(ok?'correct':'wrong');
  v.innerHTML=ok?'✓ Correct!':`✗ Incorrect — the correct answer was (${L[currentQ.answer]})`;
  document.getElementById('solutionSteps').innerHTML=currentQ.solution.map(s=>`<div class="solution-step"><div class="step-num">${s.step}</div><div class="step-text">${s.text}</div></div>`).join('');
  document.getElementById('resultPanel').style.display='block';
  if(streak>=3){
    const f=streak>=8?'🔥🔥🔥':streak>=5?'🔥🔥':'🔥';
    const sb2=document.getElementById('streakBanner');
    sb2.textContent=`${f} ${streak}-question streak! Keep it up!`;sb2.style.display='block';
  }
  const sb=document.getElementById('submitBtn');
  sb.textContent='Next Question →';sb.className='btn btn-next';sb.disabled=false;sb.onclick=nextQuestion;
  updateStats();
  if(window.MathJax)MathJax.typesetPromise([document.getElementById('card')]);
}

function updateStats(){
  document.getElementById('statAnswered').textContent=answered;
  document.getElementById('statCorrect').textContent=correct;
  document.getElementById('statWrong').textContent=wrong;
  document.getElementById('statStreak').textContent=streak;
  document.getElementById('progressBar').style.width=(answered%QUESTIONS.length/QUESTIONS.length*100)+'%';
  if(answered>=10){
    const pct=Math.round(last10.reduce((a,b)=>a+b,0)/10*100);
    const badge=document.getElementById('last10Badge');
    badge.style.display='';badge.textContent=`Last 10: ${pct}%`;
    badge.className='last10-badge '+(pct>=80?'green':pct>=60?'gold':'red');
  }
}

function endSession(){
  document.getElementById('cardWrap').style.display='none';
  document.getElementById('endScreen').style.display='block';
  const pct=answered===0?0:Math.round(correct/answered*100);
  document.getElementById('endPct').textContent=pct+'%';
  document.getElementById('endAnswered').textContent=answered;
  document.getElementById('endCorrect').textContent=correct;
  document.getElementById('endWrong').textContent=wrong;
  const msgs=['Keep practicing — series convergence takes time! 📚','Solid effort! Review the solutions and try again.','Nice work! Your convergence is improving.','Great session! Almost there — keep going!','🏆 Outstanding! You\'ve mastered Testing Series!'];
  document.getElementById('endMsg').textContent=msgs[Math.min(4,Math.floor(pct/20))];
  document.getElementById('ringCircle').style.strokeDashoffset=427-(pct/100*427);
}

function restart(){
  answered=0;correct=0;wrong=0;streak=0;last10=[];seenCount=0;
  queue=shuffle([...QUESTIONS]);
  document.getElementById('endScreen').style.display='none';
  document.getElementById('cardWrap').style.display='block';
  updateStats();pickTagline();nextQuestion();
}

pickTagline();queue=shuffle([...QUESTIONS]);nextQuestion();
</script>
